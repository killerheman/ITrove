name: Hostinger Shared Hosting CI/CD Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BUILD & VALIDATE STAGE
  # ==========================================
  build:
    name: Build & Prepare Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Production Composer Dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

  # ==========================================
  # 2. DEPLOYMENT TO HOSTINGER SHARED HOSTING
  # ==========================================
  deploy-ftp:
    name: Deploy to Hostinger via FTPS / FTP
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP for Vendor Build
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip
          coverage: none

      - name: Install Production Dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      # Sync files securely to Hostinger public_html
      - name: Sync Files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST || secrets.FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USER || secrets.FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || 'public_html/' }}
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            .env
            .env.example
            .env.backup
            .editorconfig
            README.md
            phpunit.xml
