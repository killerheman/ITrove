name: CI/CD Production Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. CI TEST & VALIDATION STAGE
  # ==========================================
  ci-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      - name: Validate Blade Syntax & Config
        run: |
          php artisan -V

  # ==========================================
  # 2. CD PRODUCTION DEPLOYMENT STAGE
  # ==========================================
  deploy:
    name: Deploy to Production Server
    needs: ci-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Option A: Deploy via SSH (VPS / DigitalOcean / AWS / Forge / Hostinger VPS)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: "${{ env.DEPLOY_SSH == 'true' }}"
        env:
          DEPLOY_SSH: ${{ secrets.SSH_HOST != '' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/var/www/html' }}
            
            # Put application into maintenance mode
            php artisan down || true

            # Pull latest changes from master
            git fetch origin master
            git reset --hard origin/master

            # Install/update production dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Run database migrations safely
            php artisan migrate --force

            # Optimize & Cache Laravel
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Set correct storage permissions
            chmod -R 775 storage bootstrap/cache

            # Bring application back online
            php artisan up

            echo "🚀 Innovation Trove successfully deployed to Production!"

      # Option B: Deploy via FTP (cPanel / Shared Hosting / Hostinger Shared)
      - name: Deploy via FTP (if FTP credentials configured)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: "${{ env.DEPLOY_FTP == 'true' }}"
        env:
          DEPLOY_FTP: ${{ secrets.FTP_SERVER != '' && secrets.SSH_HOST == '' }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            .env
            .env.example
            README.md
